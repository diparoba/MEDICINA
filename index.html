<!DOCTYPE html>
<html>
<head>
    <title>Cuerpo Humano 3D</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>🏥 Sistema Médico 3D</header>

<canvas id="scene3d"></canvas>

<div id="modal">
    <h3>Zona seleccionada</h3>
    <p id="zonaTexto"></p>
    <button onclick="cerrar()">Cerrar</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/OrbitControls.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f8ff);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.5, 5);

const renderer = new THREE.WebGLRenderer({canvas: document.getElementById("scene3d"), antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight*0.9);

// Luz
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5,10,7);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambient);

// Crear cuerpo 3D real

const material = new THREE.MeshStandardMaterial({color: 0xffd6b0});

// Cabeza
const head = new THREE.Mesh(new THREE.SphereGeometry(0.5,32,32), material);
head.position.y = 3;
head.name = "Cabeza";
scene.add(head);

// Torso
const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.8,1,2,32), material);
torso.position.y = 1.8;
torso.name = "Torso";
scene.add(torso);

// Brazos
const armGeo = new THREE.CylinderGeometry(0.25,0.25,1.8,32);

const leftArm = new THREE.Mesh(armGeo, material);
leftArm.position.set(-1.2,1.8,0);
leftArm.rotation.z = Math.PI/2;
leftArm.name = "Brazo";
scene.add(leftArm);

const rightArm = new THREE.Mesh(armGeo, material);
rightArm.position.set(1.2,1.8,0);
rightArm.rotation.z = Math.PI/2;
rightArm.name = "Brazo";
scene.add(rightArm);

// Piernas
const legGeo = new THREE.CylinderGeometry(0.3,0.3,2,32);

const leftLeg = new THREE.Mesh(legGeo, material);
leftLeg.position.set(-0.4,0,0);
leftLeg.name = "Pierna";
scene.add(leftLeg);

const rightLeg = new THREE.Mesh(legGeo, material);
rightLeg.position.set(0.4,0,0);
rightLeg.name = "Pierna";
scene.add(rightLeg);

// Controles
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Animación
function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

// Click detector
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", (event)=>{
    mouse.x = (event.clientX/window.innerWidth)*2 - 1;
    mouse.y = -(event.clientY/window.innerHeight)*2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children);

    if(intersects.length > 0){
        document.getElementById("zonaTexto").innerText =
            "Has seleccionado: " + intersects[0].object.name;

        document.getElementById("modal").style.display = "block";
    }
});

function cerrar(){
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
